 තෙමුණු පාරවල් වගේ, සමහර දුක් ටික වෙලාවකින් වේළිලා යනවා." data-en="Like roads soaked in rain, some sorrows dry in time.">🌧️ වැස්සට තෙමුණු පාරවල් වගේ, සමහර දුක් ටික වෙලාවකින් වේළිලා යනවා.</option><option value="alone" data-si="තනිවෙලා ඉන්න වෙලාවල තමයි අපිට අපිවම හොඳටම ඇහෙන්නේ." data-en="It is in our loneliest hours that we hear ourselves most clearly.">🌧️ තනිවෙලා ඉන්න වෙලාවල තමයි අපිට අපිවම හොඳටම ඇහෙන්නේ.</option><option value="fall" data-si="වැටෙන හැම පාරකම අලුත් පාඩමක් ඉගෙන ගන්න. ජීවිතය පටන් ගන්නේ එතනින්." data-en="Learn something new every time you fall. That is where life begins.">✨ වැටෙන හැම පාරකම අලුත් පාඩමක් ඉගෙන ගන්න. ජීවිතය පටන් ගන්නේ එතනින්.</option><option value="slow" data-si="හෙමින් ගියත් කමක් නැහැ, නවතින්නේ නැතුව යන්න." data-en="It does not matter how slowly you go, as long as you do not stop.">✨ හෙමින් ගියත් කමක් නැහැ, නවතින්නේ නැතුව යන්න.</option><option value="small" data-si="අද කරන පොඩි උත්සාහය හෙට ලොකු වෙනසක් වෙනවා." data-en="The small effort you make today becomes a big change tomorrow.">✨ අද කරන පොඩි උත්සාහය හෙට ලොකු වෙනසක් වෙනවා.</option><option value="night" data-si="හැම අඳුරු රාත්‍රියකටම පස්සේ ලස්සන දවසක් උදාවෙනවාමයි." data-en="After every dark night, a beautiful day always comes.">🌅 හැම අඳුරු රාත්‍රියකටම පස්සේ ලස්සන දවසක් උදාවෙනවාමයි.</option><option value="golden" data-si="හිරු බැහැගන්නේ හෙට ආයෙත් එන්න පොරොන්දු වෙලා." data-en="The sun sets with a promise to rise again tomorrow.">🌅 හිරු බැහැගන්නේ හෙට ආයෙත් එන්න පොරොන්දු වෙලා.</option><option value="evening" data-si="සමහර හැන්දෑවල් වචන නැතුවම හිත හදනවා." data-en="Some evenings heal the heart without a single word.">🌅 සමහර හැන්දෑවල් වචන නැතුවම හිත හදනවා.</option><option value="trees" data-si="ගස් අපිට උගන්නනවා, මුල් ශක්තිමත් නම් සුළඟට බය වෙන්න ඕනේ නැහැ කියලා." data-en="Trees teach us that with strong roots there is no need to fear the wind.">🌿 ගස් අපිට උගන්නනවා, මුල් ශක්තිමත් නම් සුළඟට බය වෙන්න ඕනේ නැහැ කියලා.</option><option value="river" data-si="ගඟක් වගේ ගලාගෙන යන්න. ගල් හම්බවුණත් පාර හොයාගන
